<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/kitty.ico" />
    <title>My Google AI Studio App</title>
    <style>
      body {
        margin: 0;
        background: #fde5e8;
        color: #7a2930;
        font-family: "Helvetica Neue", Arial, sans-serif;
      }

      .static-fallback {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 20% 15%, rgba(232, 240, 162, 0.65), transparent 28rem),
          radial-gradient(circle at 82% 28%, rgba(231, 180, 185, 0.78), transparent 24rem),
          linear-gradient(135deg, #fde5e8, #fff7f8 58%, #f8f6df);
      }

      .static-fallback-card {
        width: min(680px, 100%);
        padding: 36px;
        border: 2px solid #e7b4b9;
        border-radius: 28px;
        background: rgba(255, 247, 248, 0.84);
        box-shadow: 18px 18px 44px rgba(164, 86, 92, 0.16);
      }

      .static-fallback-card h1 {
        margin: 0;
        color: #a4565c;
        font-size: clamp(36px, 7vw, 64px);
        line-height: 1;
        letter-spacing: 0;
      }

      .static-fallback-card p {
        margin: 18px 0 0;
        color: rgba(122, 41, 48, 0.78);
        font-size: 16px;
        font-weight: 700;
        line-height: 1.6;
      }

      .static-fallback-card code {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 14px;
        border-radius: 999px;
        background: #e8f0a2;
        color: #5f6420;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="static-fallback">
        <section class="static-fallback-card" aria-label="App loading fallback">
          <h1>Roa Workspace</h1>
          <p>
            이 파일을 직접 열면 React/Vite 변환이 실행되지 않아 정적 미리보기만 보입니다.
            전체 앱 화면은 프로젝트 폴더에서 아래 명령으로 실행한 뒤 브라우저에서 열어주세요.
          </p>
          <code>npm run dev</code>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
